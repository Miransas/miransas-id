<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ client_name }} - Oturum Aç</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/themes/{{ theme }}.css">
</head>
<body class="theme-{{ theme }}">

    <div class="login-container">
        <!-- Shader veya Animasyon için Canvas Alanı -->
        <canvas id="shader-canvas" class="hero-section"></canvas>

        <div class="form-section" id="form-section">
            <div class="logo-wrapper">
                <img src="/static/images/{{ theme }}-logo.png" alt="{{ client_name }} Logo" onerror="this.style.display='none'">
            </div>
            <h2>{{ client_name }} Hesabınızla oturum açın</h2>
            <form action="/login" method="POST">
                <div class="form-group">
                    <label>E-posta Adresi</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Parola</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit">Oturum Aç</button>
            </form>
        </div>
    </div>

    <!-- Animasyon ve Mantık Dosyamız -->
    <script type="module" src="/static/js/login.js"></script>
</body>
</html>

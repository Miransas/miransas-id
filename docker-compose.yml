services:
  miransas-id-postgres:
    image: postgres:16-alpine
    container_name: miransas-id-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-miransas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-miransas_id}
    volumes:
      - miransas_id_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-miransas} -d ${POSTGRES_DB:-miransas_id}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - miransas-id-net

  miransas-id-redis:
    image: redis:7-alpine
    container_name: miransas-id-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required} --appendonly yes
    volumes:
      - miransas_id_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - miransas-id-net

  miransas-id-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miransas-id-app
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-miransas}:${POSTGRES_PASSWORD}@miransas-id-postgres:5432/${POSTGRES_DB:-miransas_id}
      REDIS_URL: redis://:${REDIS_PASSWORD}@miransas-id-redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS required in production}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY required}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@miransas.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Miransas ID}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:?APP_FRONTEND_URL required}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      miransas-id-postgres:
        condition: service_healthy
      miransas-id-redis:
        condition: service_healthy
    networks:
      - miransas-id-net

volumes:
  miransas_id_postgres_data:
  miransas_id_redis_data:

networks:
  miransas-id-net:
    driver: bridge

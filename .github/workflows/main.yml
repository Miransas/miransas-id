name: Miransas ID CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: miransas_id_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx # Testler için gerekli ek paketler

    - name: Lint with Ruff
      run: |
        pip install ruff
        ruff check .

    - name: Run Tests
      env:
        DATABASE_URL: postgresql://user:pass@localhost:5432/miransas_id_test
        SECRET_KEY: "test-secret-key-only-for-ci"
      run: |
        # Şimdilik test klasörü boş olduğu için hata vermemesi için:
        # pytest 
        echo "Tests will run here as we add them."

    - name: Miransas Deployment Signal
      run: echo "Build for Miransas ID Node-01 successful."